# AeroSpace Configuration
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Commands: https://nikitabobko.github.io/AeroSpace/commands
#
# To apply: copy or symlink to ~/.aerospace.toml
#   ln -sf ~/Library/CloudStorage/Dropbox/Automation/Workspace_organiser/implementation/toml_configs/aerospace.toml ~/.aerospace.toml

config-version = 2

# ─── Startup ──────────────────────────────────────────────────────────────────

start-at-login = true
# auto-reload-config is not available in 0.20.3-Beta (added in a later version)
# Reload manually: aerospace reload-config, or via service mode (alt-shift-; → esc)
after-startup-command = [
  '''exec-and-forget /opt/homebrew/bin/sketchybar'''
]

exec-on-workspace-change = ['/bin/bash', '-c',
'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Disable macOS "Hide application" (cmd-h) — prevents accidental hides
automatically-unhide-macos-hidden-apps = true

# Mouse follows focus when monitor focus changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# Also when focus moves by ⌘Tab / KM / clicks: keeps KM's conflict palette
# (opens under the mouse) on the screen of the frontmost app. "lazy" = only
# moves when the mouse is on another monitor.
on-focus-changed = ['move-mouse monitor-lazy-center']


# ─── Workspaces ───────────────────────────────────────────────────────────────

# Keep these workspaces alive even when empty
# Customise this list to your personal workflow
persistent-workspaces = ["N", "A", "K", "P", "S", "B", "R", "O", "D", "U"]
# N=Notes  A=Automation  P=Presentation  S=Session-zoom  B=Booking  R=Reading  O=sOund  D=Desktop(MacBook)

# Callback when binding mode changes (useful for status bar integration)
on-mode-changed = []

# ─── Layout ───────────────────────────────────────────────────────────────────

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

# 'tiles' = classic tiling | 'accordion' = stacked/tabbed
default-root-container-layout = 'tiles'

# 'auto' = wide monitor → horizontal, tall monitor → vertical
default-root-container-orientation = 'auto'

# ─── Key Mapping ──────────────────────────────────────────────────────────────

[key-mapping]
    preset = 'qwerty'  # AeroSpace has no azerty preset — AZERTY compensation is in the bindings below

# ─── Gaps ─────────────────────────────────────────────────────────────────────
# Set inner/outer gaps in pixels. 0 = no gaps.
# Per-monitor example: outer.top = [{ monitor.main = 16 }, 8]

[gaps]
    inner.horizontal = 12
    inner.vertical   = 18
    outer.left       = 12
    outer.bottom     = 12
    outer.top        = 40
    outer.right      = 12

# ─── Application → Workspace Assignment ───────────────────────────────────────
# Workspaces: N=Notes  A=Automation  S=Sessions  B=Booking  R=Reading  O=sOund
#
# Nomadic apps (no fixed workspace — go wherever focus is):
#   Finder, Obsidian, Quiver, IINA — use alt-shift-[letter] to move them as needed

# — Finder: float globally so it overlays without disrupting tiles —
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

# — Keyboard Maestro Engine: float all HTML prompts so they're never tiled behind other windows —
[[on-window-detected]]
    if.app-id = 'com.stairways.keyboardmaestro.engine'
    run = 'layout floating'

# — Mail Colour Palette: keep it on Mail's workspace (B) instead of wherever it was opened from —
[[on-window-detected]]
    if.app-id = 'com.stairways.keyboardmaestro.engine'
    if.window-title-regex-substring = 'Mail Colour Palette'
    run = ['layout floating', 'move-node-to-workspace B']

# — Typora scratchPad: float on current workspace —
[[on-window-detected]]
    if.app-id = 'abnerworks.Typora'
    if.window-title-regex-substring = 'scratchPad_'
    run = 'layout floating'

# — N: Notes / Writing —
[[on-window-detected]]
    if.app-id = 'net.sourceforge.skim-app.skim'
    run = 'move-node-to-workspace N'

[[on-window-detected]]
    if.app-id = 'com.devon-technologies.think'
    run = 'move-node-to-workspace N'

[[on-window-detected]]
    if.app-id = 'com.druide.Antidote'
    run = 'move-node-to-workspace N'

# Typora: nomadic — use alt-shift-n to send to N when needed (scratchPad_ stays floating in current workspace)

# Obsidian: nomadic — no fixed workspace

# — A: Automation / Code —
[[on-window-detected]]
    if.app-id = 'com.stairways.keyboardmaestro.editor'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'com.github.wez.wezterm'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'opcode.asterisk.so'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'com.exafunction.windsurf'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'ai.perplexity.comet'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'com.latenightsw.ScriptDebugger8'
    run = 'move-node-to-workspace A'

# Quiver: nomadic — no fixed workspace

# — P: Presentation (LG screen — Keynote + Affinity) —
# — Keynote recovery after restart —
# Quotes_lessons and Diagrams_lessons always go to K.
# Any other Keynote window goes to U.

# — Keynote recovery after restart —
[[on-window-detected]]
    if.app-id = 'com.apple.Keynote'
    if.window-title-regex-substring = 'Quotes_lessons'
    run = 'move-node-to-workspace K'

[[on-window-detected]]
    if.app-id = 'com.apple.Keynote'
    if.window-title-regex-substring = 'Diagrams_lessons'
    run = 'move-node-to-workspace K'

# Keynote helper panels (Find & Replace, Text Colour, Fonts…) must open on the
# CURRENT workspace, not be sent to U. First matching rule wins, so this sits
# before the catch-all below and deliberately has no move-node-to-workspace.
[[on-window-detected]]
    if.app-id = 'com.apple.Keynote'
    if.window-title-regex-substring = '^(Find & Replace|Text Colou?r|Colou?rs|Fonts|Spelling and Grammar|Replace|Find)$'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Keynote'
    run = 'move-node-to-workspace U'


[[on-window-detected]]
    if.app-id = 'com.seriflabs.affinitydesigner2'
    run = 'move-node-to-workspace P'

# — S: Session-zoom (Elgato screen — Zoom only) —
#[[on-window-detected]]
#    if.app-id = 'us.zoom.xos'
#    run = 'move-node-to-workspace S'

# — B: Booking —
[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace B'

[[on-window-detected]]
    if.app-id = 'com.busymac.busycal3'
    run = 'move-node-to-workspace B'

[[on-window-detected]]
    if.app-id = 'com.barebones.bbedit'
    run = 'move-node-to-workspace B'
    

# — R: Reading —
[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace R'

# — O: sOund —
[[on-window-detected]]
    if.app-id = 'com.rogueamoeba.audiohijack'
    run = 'move-node-to-workspace O'

[[on-window-detected]]
    if.app-id = 'com.audirvana.Audirvana-Studio'
    run = 'move-node-to-workspace O'

# Loopback: add when installed
# [[on-window-detected]]
#     if.app-id = 'com.rogueamoeba.loopback'
#     run = 'move-node-to-workspace O'

# ─── Monitor Assignment ────────────────────────────────────────────────────────
# Monitors: 1=Elgato Prom.  2=Built-in Retina Display  3=LG HDR WQHD

[workspace-to-monitor-force-assignment]
    N = 'LG HDR WQHD'
    A = 'LG HDR WQHD'
    P = 'LG HDR WQHD'              # Presentation: Keynote + Affinity Designer
    S = 'Elgato Prom.'             # Session-zoom: Zoom only, visible to students
    B = 'LG HDR WQHD'
    R = 'LG HDR WQHD'
    O = 'LG HDR WQHD'
    U = 'LG HDR WQHD'
    D = 'Built-in Retina Display'  # MacBook screen
    K = 'LG HDR WQHD' #LG HDR WQHD (your monitor index for LG)

# ─── Main Binding Mode ────────────────────────────────────────────────────────

[mode.main.binding]

    # Layout toggles
	alt-esc = [
  '''exec-and-forget aerospace reload-config''',
  '''exec-and-forget sketchybar --reload'''
]
    #alt-slash = 'layout tiles horizontal vertical'
    #alt-comma = 'layout accordion horizontal vertical'
	#alt-x     = 'layout tiles horizontal vertical'
	
	# Layout toggles and window state (action cluster)
	alt-t        = 'layout tiles horizontal vertical'   # T = Tiling orientation
	alt-shift-f  = 'layout floating tiling'            # F = Float / tile toggle (already present)

	# Resize (Bigger / Compress)
	alt-v = 'resize smart +50'                         # V = Bigger
	alt-c = 'resize smart -50'                         # C = Compress (smaller)

    # Focus (vi-style)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-i = 'focus up'
    alt-l = 'focus right'

    # Move window (arrows)
    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    # Resize
    #alt-minus = 'resize smart -50'
    #alt-z     = 'resize smart +50'

    # Switch workspace (numbers)
    #alt-1 = 'workspace 1'
    #alt-2 = 'workspace 2'
    #alt-3 = 'workspace 3'
    #alt-4 = 'workspace 4'
    #alt-5 = 'workspace 5'
    #alt-6 = 'workspace 6'
    #alt-7 = 'workspace 7'
    #alt-8 = 'workspace 8'
    #alt-9 = 'workspace 9'

    # Move window to workspace (numbers)
    #alt-shift-1 = 'move-node-to-workspace 1'
    #alt-shift-2 = 'move-node-to-workspace 2'
    #alt-shift-3 = 'move-node-to-workspace 3'
    #alt-shift-4 = 'move-node-to-workspace 4'
    #alt-shift-5 = 'move-node-to-workspace 5'
    #alt-shift-6 = 'move-node-to-workspace 6'
    #alt-shift-7 = 'move-node-to-workspace 7'
    #alt-shift-8 = 'move-node-to-workspace 8'
    #alt-shift-9 = 'move-node-to-workspace 9'

    # ── AZERTY keyboard note ──────────────────────────────────────────────────
    # AeroSpace uses physical key positions (qwerty preset).
    # On AZERTY, some keys are at different physical positions than QWERTY:
    #
    #   Key in config │ Key to press on AZERTY keyboard
    #   ──────────────┼────────────────────────────────
    #   alt-q         │ press key labeled  'a'   (workspace A — Automation)
    #   alt-z         │ press key labeled  'w'   (workspace W, if used)
    #   alt-semicolon │ press key labeled  'm'   (service mode uses shift too)
    #
    # All other letters (b,c,d,e,f,g,h,i,j,k,l,n,o,p,r,s,t,u,v,x,y) are at
    # the same physical positions on both keyboards.
    # ─────────────────────────────────────────────────────────────────────────

    # Switch workspace
    alt-q = 'workspace A'   # AZERTY: press key labeled 'a'
    alt-b = 'workspace B'
    #alt-c = 'workspace C'
    alt-d = 'workspace D'
    #alt-e = 'workspace E'
    #alt-f = 'macos-native-fullscreen off'  # exit native fullscreen
    alt-g = 'workspace G'
    alt-n = 'workspace N'
    alt-o = 'workspace O'
    alt-p = 'workspace P'
    alt-r = 'workspace R'
    alt-s = 'workspace S'
    #alt-t = 'workspace T'
    alt-u = 'workspace U'
    #alt-v = 'workspace V'
    alt-k = 'workspace K'


    # Move window to workspace
    #alt-shift-f = 'layout floating tiling'       # Toggle float/tile

#alt-shift-q = 'move-node-to-workspace --focus-follows-window A'   # AZERTY: press key labeled 'a'
#alt-shift-b = 'move-node-to-workspace --focus-follows-window B'
#alt-shift-c = 'move-node-to-workspace --focus-follows-window C'
#alt-shift-d = 'move-node-to-workspace --focus-follows-window D'
#alt-shift-e = 'move-node-to-workspace --focus-follows-window E'
#alt-shift-g = 'move-node-to-workspace --focus-follows-window G'
#alt-shift-n = 'move-node-to-workspace --focus-follows-window N'
#alt-shift-o = 'move-node-to-workspace --focus-follows-window O'
#alt-shift-p = 'move-node-to-workspace --focus-follows-window P'
#alt-shift-r = 'move-node-to-workspace --focus-follows-window R'
#alt-shift-s = 'move-node-to-workspace --focus-follows-window S'
#alt-shift-t = 'move-node-to-workspace --focus-follows-window T'
#alt-shift-u = 'move-node-to-workspace --focus-follows-window U'
#alt-shift-v = 'move-node-to-workspace --focus-follows-window V'
#alt-shift-k = 'move-node-to-workspace --focus-follows-window K'

    # Workspace navigation
    alt-tab       = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Enter service mode
    # AZERTY: press alt-shift + key labeled 'm' (physical semicolon position)
    alt-shift-semicolon = 'mode service'

# ─── Service Binding Mode ─────────────────────────────────────────────────────
# Enter with: alt-shift-;   Exit with: esc

[mode.service.binding]
    esc        = ['reload-config', 'mode main']        # Reload config + exit
    r          = ['flatten-workspace-tree', 'mode main'] # Reset layout
    f          = ['layout floating tiling', 'mode main'] # Toggle float/tile
    backspace  = ['close-all-windows-but-current', 'mode main']

    # Join windows (merge into parent container)
    alt-shift-h = ['join-with left',  'mode main']
    alt-shift-j = ['join-with down',  'mode main']
    alt-shift-k = ['join-with up',    'mode main']
    alt-shift-l = ['join-with right', 'mode main']
