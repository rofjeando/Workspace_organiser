<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WORKSP Gather to W</title>
<!-- Synchronous picker: ticks windows, sends them to workspace W. KMWindow alone in <head>. -->
<script>
function KMWindow() {
  var W = 400, H = 560, left = 40, top = 40;
  try {
    var km = window.KeyboardMaestro;
    var screen = km.GetVariable('WORKSP_paletteScreen') || 'Internal';
    var r = Number(km.Calculate('SCREENVISIBLE(' + screen + ',Right)'));
    var t = Number(km.Calculate('SCREENVISIBLE(' + screen + ',Top)'));
    var h = Number(km.Calculate('SCREENVISIBLE(' + screen + ',Height)'));
    if (r > 0) { left = r - W - 96; top = t + 8; }
    if (h > 0) { H = Math.min(H, h - 16); }
  } catch (e) { }
  return left + ', ' + top + ', ' + W + ', ' + H;
}
</script>
<style>
:root { --bg:#f5f5f7; --fg:#1d1d1f; --mute:#6e6e73; --line:#d2d2d7; --acc:#0a64d6; --card:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#262628; --fg:#f2f2f4; --mute:#9a9aa0; --line:#3d3d40; --acc:#3b8cf0; --card:#323235; }
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { padding:12px; background:var(--bg); color:var(--fg); font:13px -apple-system, "SF Pro Text", sans-serif; display:flex; flex-direction:column; gap:8px; }
h1 { font-size:13px; margin:0; display:flex; justify-content:space-between; }
h1 span { color:var(--mute); font-weight:400; }
input[type=text] { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); font:inherit; }
#list { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; }
.ws { position:sticky; top:0; padding:4px 10px; background:var(--bg); color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); }
label.row { display:flex; gap:8px; align-items:flex-start; padding:4px 10px; }
label.row:hover { background:rgba(128,128,128,.12); }
label.row small { display:block; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:320px; }
.btns { display:grid; grid-template-columns:2fr 1fr; gap:6px; }
button { font:inherit; padding:7px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
#status { color:var(--mute); font-size:11px; min-height:14px; }
</style>
</head>
<body>
<h1>Gather windows in W <span>Work in progress</span></h1>
<input type="text" id="filter" placeholder="Filter by app or title">
<div id="list"></div>
<div class="btns">
  <button id="bGo" class="primary">Send to W  ⏎</button>
  <button id="bCancel">Cancel  esc</button>
</div>
<div id="status"></div>
<script>
(function () {
  var km = window.KeyboardMaestro, items = [];

  function say(m) { document.getElementById('status').textContent = m; }

  function parse() {
    var lines = (km.GetVariable('WORKSP_gatherList') || '').split('\n');
    for (var i = 0; i < lines.length; i++) {
      var p = lines[i].split('\t');
      if (p[0] === 'ERROR') { say('AeroSpace: ' + (p[1] || 'error')); }
      else if (p.length >= 3 && /^[0-9]+$/.test(p[0])) {
        items.push({ id: p[0], ws: p[1], app: p[2], title: p.slice(3).join(' '), checked: false });
      }
    }
  }

  function render() {
    var q = document.getElementById('filter').value.toLowerCase();
    var list = document.getElementById('list');
    list.innerHTML = '';
    var last = null, shown = 0;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (q && (it.app + ' ' + it.title).toLowerCase().indexOf(q) < 0) { continue; }
      if (it.ws !== last) {
        var h = document.createElement('div'); h.className = 'ws'; h.textContent = 'Workspace ' + it.ws;
        list.appendChild(h); last = it.ws;
      }
      var lab = document.createElement('label'); lab.className = 'row';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = it.checked;
      (function (item, box) { box.addEventListener('change', function () { item.checked = box.checked; }); })(it, cb);
      var box = document.createElement('div');
      var n = document.createElement('div'); n.textContent = it.app;
      var s = document.createElement('small'); s.textContent = it.title || '(no title)';
      box.appendChild(n); box.appendChild(s); lab.appendChild(cb); lab.appendChild(box); list.appendChild(lab);
      shown++;
    }
    if (!shown) { list.innerHTML = '<div style="padding:10px;color:var(--mute)">No matching windows.</div>'; }
  }

  function finish(action, ids) {
    km.SetVariable('WORKSP_stripAction', action);
    km.SetVariable('WORKSP_gatherIds', ids.join('\n'));
    km.Submit();
  }

  function send() {
    var ids = [];
    for (var i = 0; i < items.length; i++) { if (items[i].checked) { ids.push(items[i].id); } }
    if (!ids.length) { say('Tick at least one window.'); return; }
    finish('gather', ids);
  }

  parse(); render();
  document.getElementById('filter').addEventListener('input', render);
  document.getElementById('bGo').addEventListener('click', send);
  document.getElementById('bCancel').addEventListener('click', function () { finish('cancelled', []); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { finish('cancelled', []); }
    else if (ev.key === 'Enter') { send(); }
  });
  document.getElementById('filter').focus();
  if (!document.getElementById('status').textContent) { say('Windows from every workspace. Tick, then Return.'); }
})();
</script>
</body>
</html>
