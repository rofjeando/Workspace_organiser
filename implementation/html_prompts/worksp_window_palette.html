<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WORKSP Window Palette</title>
<!-- KMWindow stays alone in <head> (KM calls it while the page loads). Screen: set the KM variable
     WORKSP_paletteScreen to Main, Internal or a screen name; default Internal (MacBook). -->
<script>
function KMWindow() {
  var W = 340, H = 260, left = 40, top = 60;
  try {
    var km = window.KeyboardMaestro;
    var screen = km.GetVariable('WORKSP_paletteScreen') || 'Internal';
    var rows = (km.GetVariable('WORKSP_floatList') || '').split('\n').length - 1;
    H = Math.min(560, 215 + 28 * Math.max(rows, 1));
    var r = Number(km.Calculate('SCREENVISIBLE(' + screen + ',Right)'));
    var t = Number(km.Calculate('SCREENVISIBLE(' + screen + ',Top)'));
    if (r > 0) { left = r - W - 12; top = t + 12; }
  } catch (e) { }
  return left + ', ' + top + ', ' + W + ', ' + H;
}
</script>
<style>
:root { --bg:#f5f5f7; --fg:#1d1d1f; --mute:#6e6e73; --line:#d2d2d7; --acc:#0a64d6; --accfg:#fff; --card:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#262628; --fg:#f2f2f4; --mute:#9a9aa0; --line:#3d3d40; --acc:#3b8cf0; --accfg:#fff; --card:#323235; }
}
* { box-sizing: border-box; }
body { margin:0; padding:12px; background:var(--bg); color:var(--fg); font:13px -apple-system, "SF Pro Text", sans-serif; }
h1 { font-size:13px; margin:0 0 8px; display:flex; justify-content:space-between; }
h1 span { color:var(--mute); font-weight:400; }
.list { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 0; }
label.row { display:flex; gap:8px; align-items:flex-start; padding:5px 10px; cursor:default; }
label.row:hover { background:rgba(128,128,128,.12); }
label.row small { display:block; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:250px; }
.sub { margin:10px 0 4px; color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.sub + .list label.row { opacity:.7; }
.empty { padding:8px 10px; color:var(--mute); }
.btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
button { font:inherit; padding:7px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
button.primary { background:var(--acc); color:var(--accfg); border-color:var(--acc); grid-column:1 / 3; }
button:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
#status { margin-top:8px; min-height:16px; color:var(--mute); font-size:11px; }
</style>
</head>
<body>
<h1>Floating windows <span id="ws"></span></h1>
<div id="main"></div>
<div class="btns">
  <button id="bSel" class="primary">Unfloat selected  ⏎</button>
  <button id="bAll">Unfloat all listed</button>
  <button id="bFlat">Side by side</button>
  <button id="bClose" style="grid-column:1 / 3">Close  esc</button>
</div>
<div id="status"></div>
<script>
(function () {
  var km = window.KeyboardMaestro;
  var wsName = '', items = [];

  function say(msg) { document.getElementById('status').textContent = msg; }

  function parse() {
    var raw = km.GetVariable('WORKSP_floatList') || '';
    var lines = raw.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var p = lines[i].split('\t');
      if (p[0] === 'WS') { wsName = p[1] || ''; }
      else if (p[0] === 'ERROR') { say('AeroSpace: ' + (p[1] || 'error')); }
      else if (p.length >= 4 && /^[0-9]+$/.test(p[0])) {
        items.push({ id: p[0], keep: p[1] === '1', app: p[2], title: p.slice(3).join(' ') });
      }
    }
  }

  function addRows(parent, list, checked) {
    for (var i = 0; i < list.length; i++) {
      var lab = document.createElement('label'); lab.className = 'row';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = list[i].id; cb.checked = checked;
      var box = document.createElement('div');
      var name = document.createElement('div'); name.textContent = list[i].app;
      var sm = document.createElement('small'); sm.textContent = list[i].title || '(no title)';
      box.appendChild(name); box.appendChild(sm);
      lab.appendChild(cb); lab.appendChild(box); parent.appendChild(lab);
    }
  }

  function render() {
    document.getElementById('ws').textContent = wsName ? 'workspace ' + wsName : '';
    var main = document.getElementById('main');
    var normal = [], kept = [];
    for (var i = 0; i < items.length; i++) { (items[i].keep ? kept : normal).push(items[i]); }
    var l1 = document.createElement('div'); l1.className = 'list';
    if (normal.length) { addRows(l1, normal, false); }
    else { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No floating windows to unfloat.'; l1.appendChild(e); }
    main.appendChild(l1);
    if (kept.length) {
      var h = document.createElement('div'); h.className = 'sub'; h.textContent = 'Meant to float (Finder, prompts, scratchPad)';
      var l2 = document.createElement('div'); l2.className = 'list'; addRows(l2, kept, false);
      main.appendChild(h); main.appendChild(l2);
    }
  }

  function boxes() { return document.querySelectorAll('input[type=checkbox]'); }

  function finish(action, ids) {
    km.SetVariable('WORKSP_paletteAction', action);
    km.SetVariable('WORKSP_paletteWs', wsName);
    km.SetVariable('WORKSP_paletteIds', ids.join('\n'));
    km.Submit();
  }

  function unfloatSelected() {
    var ids = [], b = boxes();
    for (var i = 0; i < b.length; i++) { if (b[i].checked) { ids.push(b[i].value); } }
    if (!ids.length) { say('Tick at least one window.'); return; }
    finish('unfloat', ids);
  }

  function unfloatAll() {
    var ids = [];
    for (var i = 0; i < items.length; i++) { if (!items[i].keep) { ids.push(items[i].id); } }
    if (!ids.length) { say('Nothing to unfloat.'); return; }
    finish('unfloat', ids);
  }

  parse(); render();
  document.getElementById('bSel').addEventListener('click', unfloatSelected);
  document.getElementById('bAll').addEventListener('click', unfloatAll);
  document.getElementById('bFlat').addEventListener('click', function () { finish('flatten', []); });
  document.getElementById('bClose').addEventListener('click', function () { finish('cancelled', []); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { finish('cancelled', []); }
    else if (ev.key === 'Enter') { unfloatSelected(); }
  });
  if (!document.getElementById('status').textContent) { say(items.length ? 'Tick windows, then Return.' : 'Nothing floating here. "Side by side" still works.'); }
})();
</script>
</body>
</html>
